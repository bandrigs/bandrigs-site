<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="t">
<title id="t">Illustration of the BandRigs solo artist rig in an 8-space rolling rack</title>
<defs>
  <linearGradient id="caseG" x1="0" x2="1"><stop offset="0" stop-color="#1b1e22"/><stop offset=".5" stop-color="#262a30"/><stop offset="1" stop-color="#1b1e22"/></linearGradient>
  <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3036"/><stop offset="1" stop-color="#1d2024"/></linearGradient>
