  <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<!-- floor shadow -->
<ellipse cx="320" cy="536" rx="250" ry="10" fill="#000" opacity=".5" filter="url(#soft)"/>
