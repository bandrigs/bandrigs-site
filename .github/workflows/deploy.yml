name: Publish to Cloudflare Pages

# Every push publishes the site. Pushes to main go live on the production
# project. Any other branch gets its own preview link.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Copy only the site files so .github, README and the like aren't published.
      - name: Collect site files
        run: |
          mkdir -p dist
          cp index.html styles.css app.js logic.js dist/
          cp -r assets dist/
          for f in robots.txt sitemap.xml _headers _redirects 404.html; do
            [ -f "$f" ] && cp "$f" dist/ || true
          done

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 670f9f726847c524c89adaa01eef8170
          command: pages deploy dist --project-name=bandrigs --branch=${{ github.ref_name }}
